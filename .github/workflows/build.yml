name: Windows exe (signed)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build desktop app (createDistributable)
        run: gradle createDistributable --no-daemon --stacktrace

      - name: Sign YouCode.exe
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String("${{ secrets.CODE_SIGN_PFX }}"))
          $pass = "${{ secrets.CODE_SIGN_PASSWORD }}"

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Select-Object -First 1 }
          Write-Host "signtool: $($signtool.FullName)"

          $exe = Get-ChildItem -Recurse -Filter YouCode.exe build\compose | Select-Object -First 1
          if (-not $exe) { throw "YouCode.exe not found under build\compose" }
          $src = $exe.FullName
          Write-Host "exe: $src"

          # sign a copy first: Defender can hold a lock on a freshly built exe
          $tmp = Join-Path $env:RUNNER_TEMP "YouCode-signed.exe"
          Copy-Item $src $tmp -Force
          Set-ItemProperty $tmp -Name IsReadOnly -Value $false
          Start-Sleep -Seconds 5

          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "signtool attempt $i"
            & $signtool.FullName sign /f $pfx /p $pass /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /d "YouCode" $tmp
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Start-Sleep -Seconds 10
          }

          if (-not $ok) {
            Write-Host "signtool failed, falling back to Set-AuthenticodeSignature"
            $sec = ConvertTo-SecureString $pass -AsPlainText -Force
            $cert = Get-PfxCertificate -FilePath $pfx -Password $sec
            Set-AuthenticodeSignature -FilePath $tmp -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256 | Out-Null
            if (-not (Get-AuthenticodeSignature $tmp).SignerCertificate) { throw "signing failed" }
          }

          Copy-Item $tmp $src -Force
          Write-Host "--- signature ---"
          Get-AuthenticodeSignature $src | Format-List Status,StatusMessage,@{n='Subject';e={$_.SignerCertificate.Subject}},@{n='Thumbprint';e={$_.SignerCertificate.Thumbprint}}
          if ((Get-AuthenticodeSignature $src).Status -ne "UnknownError" -and (Get-AuthenticodeSignature $src).SignerCertificate -eq $null) { throw "no signature on exe" }
          if ((Get-AuthenticodeSignature $src).SignerCertificate -eq $null) { throw "no signature on exe" }

      - name: Zip app folder with YouCode.exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter YouCode.exe build\compose | Select-Object -First 1
          if (-not $exe) { throw "YouCode.exe not found under build\compose" }
          $dir = $exe.Directory.FullName
          Write-Host "Packing $dir"

          Copy-Item signing\YouCode-CodeSigning.cer (Join-Path $dir "YouCode-CodeSigning.cer") -Force
          Copy-Item signing\install-certificate.ps1 (Join-Path $dir "install-certificate.ps1") -Force
          Copy-Item signing\install-certificate.cmd (Join-Path $dir "install-certificate.cmd") -Force

          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath out\YouCode-Windows.zip -Force
          Get-Item out\YouCode-Windows.zip | Format-List Name,Length

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-build-${{ github.run_number }}
          name: YouCode PC build ${{ github.run_number }}
          files: out/YouCode-Windows.zip
          fail_on_unmatched_files: true
